name: CodeQL

# Static analysis (SAST) for the Worker (src/), the SPA (web/src) and scripts (#640, epic #633).
# Free because the repo is public. Findings land in the GitHub Security tab → Code scanning.
# `security-extended` adds the higher-recall query pack on top of the default suite.
#
# Not path-filtered: a docs-only PR is cheap to scan, and guessing which paths matter is how a
# finding slips through.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 19 * * 0" # weekly, Mon 05:17 AEST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
