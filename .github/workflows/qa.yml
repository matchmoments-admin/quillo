name: New-user browser QA

# The automated new-user QA suite (#699, scripts/qa/README.md): the real SPA in Chromium against a local
# `wrangler dev` with every first-timer journey flag ON, the QA inference stub (no paid model, no
# secrets) and a scratch D1, at 1280px and 390px. It is its own job, not part of `npm test`: it boots
# wrangler several times and needs a Chromium binary, so it takes minutes, where the unit gate takes
# seconds. Known defects are tracked by issue in scripts/qa/known.ts and don't fail the job; any NEW
# failure does.
on:
  pull_request:
    paths:
      - "src/**"
      - "web/**"
      - "scripts/qa/**"
      - "migrations/**"
      - "schema.sql"
      - "wrangler.toml"
      - "package.json"
      - ".github/workflows/qa.yml"

# One QA run per PR branch: a new push cancels the run it supersedes (each run boots wrangler several times).
concurrency:
  group: qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-24.04 # Playwright 1.60 cannot install Chromium deps on ubuntu-latest (26.04) yet
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm --prefix web ci
      # @playwright/test is a direct devDependency, pinned to the playwright version promptfoo also pulls in,
      # so the browser installed here matches the library the QA scripts load.
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser QA (npm run qa:browser)
        run: npm run qa:browser
      - name: Upload the QA report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-report
          path: |
            .qa/report.md
            .qa/report.json
            .qa/wrangler-*.log
          if-no-files-found: ignore
