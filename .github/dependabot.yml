# Dependabot version updates (#640, epic #633). Dependabot *alerts* and secret scanning +
# push protection are enabled in repo settings; this file adds the weekly upgrade PRs so
# patch-level fixes land without anyone remembering to look. See
# docs/security/vulnerability-management.md for the triage SLAs.
#
# Minor + patch bumps are grouped into ONE PR per ecosystem per week (cheap to review, the full
# `npm test` persona suite gates it). Majors arrive as individual PRs because they are the
# ones that need reading — e.g. tailwindcss 3→4, react-router 6→7, vite 6→7+.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: Australia/Sydney
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    groups:
      server-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
      timezone: Australia/Sydney
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    groups:
      web-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: Australia/Sydney
    labels: ["dependencies"]
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
